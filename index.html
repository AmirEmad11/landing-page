<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>توقعات × سكربتات × مسابقات</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #fff;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      color: #ffd700;
    }
    p {
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.8;
    }
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .card {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 10px;
      color: #00c3ff;
    }
    .card p {
      font-size: 16px;
      color: #ddd;
    }
    a.button {
      display: inline-block;
      background: #0088cc;
      color: #fff;
      padding: 15px 35px;
      text-decoration: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      transition: 0.3s;
      margin-top: 20px;
    }
    a.button:hover {
      background: #006699;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>⚽ توقعات + سكربتات + مسابقات 🔥</h1>
  <p>انضم لقناتنا الخاصة على تيليجرام واستفاد من:</p>

  <div class="features">
    <div class="card">
      <h2>🎯 توقعات مجانية</h2>
      <p>تحليلات دقيقة وتوقعات يومية لمباريات كبيرة.</p>
    </div>
    <div class="card">
      <h2>🕹️ سكربتات حصرية</h2>
      <p>اسكربتات مجانية لألعاب زي التفاحة والطيارة.</p>
    </div>
    <div class="card">
      <h2>💰 مسابقات على جوائز</h2>
      <p>شارك في مسابقات دورية واربح فلوس وجوايز مميزة.</p>
    </div>
  </div>

  <a class="button" href="https://t.me/+VXeES3wbizY2NThk" target="_blank">انضم الآن</a>
</body>
</html>
